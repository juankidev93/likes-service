[package]
name = "likes-service"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "json"] }
uuid = { version = "1", features = ["v4"] }
