openapi: 3.0.3
info:
  title: Social API
  version: 1.0.0
  description: |
    OpenAPI specification for the likes-focused Social API.

    The SSE endpoint is documented as a `text/event-stream` response with example payloads,
    but OpenAPI is not used here to model the full streaming lifecycle.
servers:
  - url: /
    description: Same-origin server
tags:
  - name: Likes
  - name: Health
  - name: Observability
paths:
  /v1/likes:
    post:
      tags: [Likes]
      summary: Like content
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLikeRequest'
      responses:
        '201':
          description: Like created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LikeResponse'
              example:
                liked: true
                already_existed: false
                count: 42
                liked_at: '2026-02-02T17:00:00Z'
        '200':
          description: Like already existed, request remained idempotent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LikeResponse'
              example:
                liked: true
                already_existed: true
                count: 42
                liked_at: '2026-02-02T17:00:00Z'
        '400':
          $ref: '#/components/responses/InvalidLikeRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/ContentNotFoundResponse'
        '429':
          $ref: '#/components/responses/RateLimitedResponse'
        '503':
          $ref: '#/components/responses/DependencyUnavailableResponse'
        '500':
          $ref: '#/components/responses/InternalErrorResponse'
  /v1/likes/{content_type}/{content_id}:
    delete:
      tags: [Likes]
      summary: Unlike content
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ContentTypePath'
        - $ref: '#/components/parameters/ContentIdPath'
      responses:
        '200':
          description: Unlike result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnlikeResponse'
              example:
                liked: false
                was_liked: true
                count: 41
        '400':
          $ref: '#/components/responses/InvalidUnlikeRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '404':
          $ref: '#/components/responses/ContentNotFoundResponse'
        '429':
          $ref: '#/components/responses/RateLimitedResponse'
        '503':
          $ref: '#/components/responses/DependencyUnavailableResponse'
        '500':
          $ref: '#/components/responses/InternalErrorResponse'
  /v1/likes/{content_type}/{content_id}/count:
    get:
      tags: [Likes]
      summary: Get like count
      parameters:
        - $ref: '#/components/parameters/ContentTypePath'
        - $ref: '#/components/parameters/ContentIdPath'
      responses:
        '200':
          description: Like count
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LikeCountResponse'
              example:
                content_type: post
                content_id: 731b0395-4888-4822-b516-05b4b7bf2089
                count: 41
        '400':
          $ref: '#/components/responses/InvalidPathRequestResponse'
        '429':
          $ref: '#/components/responses/RateLimitedResponse'
        '500':
          $ref: '#/components/responses/InternalErrorResponse'
  /v1/likes/{content_type}/{content_id}/status:
    get:
      tags: [Likes]
      summary: Get authenticated user's like status
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ContentTypePath'
        - $ref: '#/components/parameters/ContentIdPath'
      responses:
        '200':
          description: Like status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LikeStatusResponse'
              examples:
                liked:
                  value:
                    liked: true
                    liked_at: '2026-02-02T17:00:00Z'
                notLiked:
                  value:
                    liked: false
                    liked_at: null
        '400':
          $ref: '#/components/responses/InvalidPathRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '503':
          $ref: '#/components/responses/DependencyUnavailableResponse'
        '500':
          $ref: '#/components/responses/InternalErrorResponse'
  /v1/likes/user:
    get:
      tags: [Likes]
      summary: List authenticated user's liked items
      security:
        - bearerAuth: []
      parameters:
        - name: content_type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ContentType'
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Page of likes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserLikesResponse'
              example:
                items:
                  - content_type: post
                    content_id: 731b0395-4888-4822-b516-05b4b7bf2089
                    liked_at: '2026-02-02T17:00:00Z'
                next_cursor: eyJ0IjoiMjAyNi0wMi0wMlQxNjowMDowMFoiLCJpZCI6IjEyMyJ9
                has_more: true
        '400':
          $ref: '#/components/responses/UserLikesBadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '503':
          $ref: '#/components/responses/DependencyUnavailableResponse'
        '500':
          $ref: '#/components/responses/InternalErrorResponse'
  /v1/likes/batch/counts:
    post:
      tags: [Likes]
      summary: Get like counts for up to 100 content items
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchLikesRequest'
      responses:
        '200':
          description: Batch counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchLikeCountsResponse'
              example:
                results:
                  - content_type: post
                    content_id: 731b0395-4888-4822-b516-05b4b7bf2089
                    count: 41
                  - content_type: bonus_hunter
                    content_id: c3d4e5f6-a7b8-9012-cdef-123456789012
                    count: 7
        '400':
          $ref: '#/components/responses/BatchCountsBadRequestResponse'
        '429':
          $ref: '#/components/responses/RateLimitedResponse'
        '500':
          $ref: '#/components/responses/InternalErrorResponse'
  /v1/likes/batch/statuses:
    post:
      tags: [Likes]
      summary: Get authenticated user's like statuses for up to 100 content items
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchLikesRequest'
      responses:
        '200':
          description: Batch statuses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchLikeStatusesResponse'
              example:
                results:
                  - content_type: post
                    content_id: 731b0395-4888-4822-b516-05b4b7bf2089
                    liked: true
                    liked_at: '2026-02-02T17:00:00Z'
                  - content_type: bonus_hunter
                    content_id: c3d4e5f6-a7b8-9012-cdef-123456789012
                    liked: false
                    liked_at: null
        '400':
          $ref: '#/components/responses/BatchStatusesBadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '503':
          $ref: '#/components/responses/DependencyUnavailableResponse'
        '500':
          $ref: '#/components/responses/InternalErrorResponse'
  /v1/likes/top:
    get:
      tags: [Likes]
      summary: Get top liked content for a time window
      parameters:
        - name: content_type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ContentType'
        - name: window
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/TopLikesWindow'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
      responses:
        '200':
          description: Leaderboard
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopLikesResponse'
              example:
                window: 7d
                content_type: post
                items:
                  - content_type: post
                    content_id: 731b0395-4888-4822-b516-05b4b7bf2089
                    count: 1547
                  - content_type: post
                    content_id: 9601c044-4888-4822-b516-05b4b7bf2999
                    count: 892
        '400':
          $ref: '#/components/responses/TopLikesBadRequestResponse'
        '429':
          $ref: '#/components/responses/RateLimitedResponse'
        '500':
          $ref: '#/components/responses/InternalErrorResponse'
  /v1/likes/stream:
    get:
      tags: [Likes]
      summary: Stream like and unlike events for a single content item
      parameters:
        - name: content_type
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/ContentType'
        - name: content_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                like:
                  value: |-
                    data: {"event":"like","user_id":"11111111-1111-1111-1111-111111111111","count":42,"timestamp":"2026-02-02T17:00:01Z"}
                unlike:
                  value: |-
                    data: {"event":"unlike","user_id":"11111111-1111-1111-1111-111111111111","count":41,"timestamp":"2026-02-02T17:00:05Z"}
                heartbeat:
                  value: |-
                    data: {"event":"heartbeat","timestamp":"2026-02-02T17:00:15Z"}
                shutdown:
                  value: |-
                    data: {"event":"shutdown","timestamp":"2026-02-02T17:00:30Z"}
        '400':
          $ref: '#/components/responses/InvalidStreamRequestResponse'
        '429':
          $ref: '#/components/responses/RateLimitedResponse'
        '503':
          $ref: '#/components/responses/DependencyUnavailableResponse'
  /health/live:
    get:
      tags: [Health]
      summary: Liveness probe
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveHealthResponse'
              example:
                status: ok
  /health/ready:
    get:
      tags: [Health]
      summary: Readiness probe
      responses:
        '200':
          description: All critical dependencies are ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyHealthResponse'
              example:
                status: ready
                checks:
                  postgres: ok
                  redis: ok
                  content_api: ok
        '503':
          description: At least one dependency is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyHealthResponse'
              example:
                status: not_ready
                checks:
                  postgres: ok
                  redis: failed
                  content_api: ok
  /metrics:
    get:
      tags: [Observability]
      summary: Prometheus metrics
      responses:
        '200':
          description: Metrics payload
          content:
            text/plain:
              schema:
                type: string
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque token
  parameters:
    ContentTypePath:
      name: content_type
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ContentType'
    ContentIdPath:
      name: content_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    ErrorResponse:
      description: Error response
      headers:
        x-request-id:
          schema:
            type: string
        x-ratelimit-limit:
          schema:
            type: integer
        x-ratelimit-remaining:
          schema:
            type: integer
        x-ratelimit-reset:
          schema:
            type: integer
        retry-after:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnauthorizedResponse:
      description: Missing, malformed, or invalid token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: UNAUTHORIZED
              message: invalid bearer token
              request_id: req_a1b2c3d4
    ContentNotFoundResponse:
      description: Content validation failed against Content API
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: CONTENT_NOT_FOUND
              message: content not found
              request_id: req_a1b2c3d4
              details:
                content_type: post
                content_id: 731b0395-4888-4822-b516-05b4b7bf2089
    DependencyUnavailableResponse:
      description: External dependency unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: DEPENDENCY_UNAVAILABLE
              message: dependency unavailable
              request_id: req_a1b2c3d4
    InternalErrorResponse:
      description: Unexpected internal error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INTERNAL_ERROR
              message: internal error
              request_id: req_a1b2c3d4
    RateLimitedResponse:
      description: Rate limit exceeded
      headers:
        x-ratelimit-limit:
          schema:
            type: integer
        x-ratelimit-remaining:
          schema:
            type: integer
        x-ratelimit-reset:
          schema:
            type: integer
        retry-after:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: RATE_LIMITED
              message: rate limit exceeded
              request_id: req_a1b2c3d4
              details:
                limit: 1000
                remaining: 0
                reset_epoch_seconds: 1773770400
                retry_after_seconds: 60
    InvalidPathRequestResponse:
      description: Invalid content_type or content_id
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidContentType:
              value:
                error:
                  code: INVALID_CONTENT_TYPE
                  message: invalid content type
                  request_id: req_a1b2c3d4
                  details:
                    field: content_type
            invalidContentId:
              value:
                error:
                  code: INVALID_CONTENT_ID
                  message: invalid content id
                  request_id: req_a1b2c3d4
                  details:
                    field: content_id
    InvalidLikeRequestResponse:
      description: Invalid like request payload
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidContentType:
              value:
                error:
                  code: INVALID_CONTENT_TYPE
                  message: invalid content type
                  request_id: req_a1b2c3d4
                  details:
                    field: content_type
            invalidContentId:
              value:
                error:
                  code: INVALID_CONTENT_ID
                  message: invalid content id
                  request_id: req_a1b2c3d4
                  details:
                    field: content_id
            contentTypeUnknown:
              value:
                error:
                  code: CONTENT_TYPE_UNKNOWN
                  message: content type unknown
                  request_id: req_a1b2c3d4
                  details:
                    content_type: unknown
    InvalidUnlikeRequestResponse:
      description: Invalid unlike request path parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidContentType:
              value:
                error:
                  code: INVALID_CONTENT_TYPE
                  message: invalid content type
                  request_id: req_a1b2c3d4
                  details:
                    field: content_type
            invalidContentId:
              value:
                error:
                  code: INVALID_CONTENT_ID
                  message: invalid content id
                  request_id: req_a1b2c3d4
                  details:
                    field: content_id
            contentTypeUnknown:
              value:
                error:
                  code: CONTENT_TYPE_UNKNOWN
                  message: content type unknown
                  request_id: req_a1b2c3d4
                  details:
                    content_type: unknown
    UserLikesBadRequestResponse:
      description: Invalid user likes request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidCursor:
              value:
                error:
                  code: INVALID_CURSOR
                  message: invalid cursor
                  request_id: req_a1b2c3d4
            invalidLimit:
              value:
                error:
                  code: INVALID_LIMIT
                  message: invalid limit
                  request_id: req_a1b2c3d4
            invalidContentType:
              value:
                error:
                  code: INVALID_CONTENT_TYPE
                  message: invalid content type
                  request_id: req_a1b2c3d4
                  details:
                    field: content_type
    BatchCountsBadRequestResponse:
      description: Invalid batch counts request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            batchTooLarge:
              value:
                error:
                  code: BATCH_TOO_LARGE
                  message: batch too large
                  request_id: req_a1b2c3d4
            invalidContentId:
              value:
                error:
                  code: INVALID_CONTENT_ID
                  message: invalid content id
                  request_id: req_a1b2c3d4
                  details:
                    field: content_id
    BatchStatusesBadRequestResponse:
      description: Invalid batch statuses request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            batchTooLarge:
              value:
                error:
                  code: BATCH_TOO_LARGE
                  message: batch too large
                  request_id: req_a1b2c3d4
            invalidContentType:
              value:
                error:
                  code: INVALID_CONTENT_TYPE
                  message: invalid content type
                  request_id: req_a1b2c3d4
                  details:
                    field: content_type
    TopLikesBadRequestResponse:
      description: Invalid leaderboard request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidWindow:
              value:
                error:
                  code: INVALID_WINDOW
                  message: invalid window
                  request_id: req_a1b2c3d4
            invalidLimit:
              value:
                error:
                  code: INVALID_LIMIT
                  message: invalid limit
                  request_id: req_a1b2c3d4
            invalidContentType:
              value:
                error:
                  code: INVALID_CONTENT_TYPE
                  message: invalid content type
                  request_id: req_a1b2c3d4
                  details:
                    field: content_type
    InvalidStreamRequestResponse:
      description: Invalid SSE stream query
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidContentType:
              value:
                error:
                  code: INVALID_CONTENT_TYPE
                  message: invalid content type
                  request_id: req_a1b2c3d4
                  details:
                    field: content_type
            invalidContentId:
              value:
                error:
                  code: INVALID_CONTENT_ID
                  message: invalid content id
                  request_id: req_a1b2c3d4
                  details:
                    field: content_id
  schemas:
    ContentType:
      type: string
      enum: [post, bonus_hunter, top_picks]
    TopLikesWindow:
      type: string
      enum: [24h, 7d, 30d, all]
    CreateLikeRequest:
      type: object
      required: [content_type, content_id]
      properties:
        content_type:
          $ref: '#/components/schemas/ContentType'
        content_id:
          type: string
          format: uuid
    BatchLikesRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/BatchLikeItem'
    BatchLikeItem:
      type: object
      required: [content_type, content_id]
      properties:
        content_type:
          $ref: '#/components/schemas/ContentType'
        content_id:
          type: string
          format: uuid
    LikeResponse:
      type: object
      required: [liked, already_existed, count]
      properties:
        liked:
          type: boolean
        already_existed:
          type: boolean
        count:
          type: integer
          format: int64
        liked_at:
          type: string
          format: date-time
          nullable: true
    UnlikeResponse:
      type: object
      required: [liked, was_liked, count]
      properties:
        liked:
          type: boolean
        was_liked:
          type: boolean
        count:
          type: integer
          format: int64
    LikeCountResponse:
      type: object
      required: [content_type, content_id, count]
      properties:
        content_type:
          $ref: '#/components/schemas/ContentType'
        content_id:
          type: string
          format: uuid
        count:
          type: integer
          format: int64
    LikeStatusResponse:
      type: object
      required: [liked]
      properties:
        liked:
          type: boolean
        liked_at:
          type: string
          format: date-time
          nullable: true
    BatchLikeCountsResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/BatchLikeCountItem'
    BatchLikeCountItem:
      type: object
      required: [content_type, content_id, count]
      properties:
        content_type:
          $ref: '#/components/schemas/ContentType'
        content_id:
          type: string
          format: uuid
        count:
          type: integer
          format: int64
    BatchLikeStatusesResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/BatchLikeStatusItem'
    BatchLikeStatusItem:
      type: object
      required: [content_type, content_id, liked]
      properties:
        content_type:
          $ref: '#/components/schemas/ContentType'
        content_id:
          type: string
          format: uuid
        liked:
          type: boolean
        liked_at:
          type: string
          format: date-time
          nullable: true
    UserLikesResponse:
      type: object
      required: [items, has_more]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserLikeItem'
        next_cursor:
          type: string
          nullable: true
        has_more:
          type: boolean
    UserLikeItem:
      type: object
      required: [content_type, content_id, liked_at]
      properties:
        content_type:
          $ref: '#/components/schemas/ContentType'
        content_id:
          type: string
          format: uuid
        liked_at:
          type: string
          format: date-time
    TopLikesResponse:
      type: object
      required: [window, items]
      properties:
        window:
          $ref: '#/components/schemas/TopLikesWindow'
        content_type:
          allOf:
            - $ref: '#/components/schemas/ContentType'
          nullable: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/TopLikeItem'
    TopLikeItem:
      type: object
      required: [content_type, content_id, count]
      properties:
        content_type:
          $ref: '#/components/schemas/ContentType'
        content_id:
          type: string
          format: uuid
        count:
          type: integer
          format: int64
    LiveHealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
    ReadyHealthResponse:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        checks:
          type: object
          required: [postgres, redis, content_api]
          properties:
            postgres:
              type: string
              enum: [ok, failed]
            redis:
              type: string
              enum: [ok, failed]
            content_api:
              type: string
              enum: [ok, failed]
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: CONTENT_NOT_FOUND
            message:
              type: string
              example: content not found
            request_id:
              type: string
              nullable: true
            details:
              nullable: true
              oneOf:
                - type: object
