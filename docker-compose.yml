services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: likes_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/20260315120000_init_likes.sql:/docker-entrypoint-initdb.d/001_init_likes.sql:ro
      - ./migrations/20260317133000_add_like_hourly_counts.sql:/docker-entrypoint-initdb.d/002_add_like_hourly_counts.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d likes_service"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  social-api:
    build:
      context: .
      network: host
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mock-profile-api:
        condition: service_healthy
      mock-post-api:
        condition: service_healthy
      mock-bonus-hunter-api:
        condition: service_healthy
      mock-top-picks-api:
        condition: service_healthy
    environment:
      APP_MODE: social-api
      SERVICE_HOST: 0.0.0.0
      HTTP_PORT: 8080
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/likes_service
      READ_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/likes_service
      REDIS_URL: redis://redis:6379/
      LOG_LEVEL: info
      DB_MAX_CONNECTIONS: 20
      DB_MIN_CONNECTIONS: 5
      DB_ACQUIRE_TIMEOUT_SECS: 5
      REDIS_POOL_SIZE: 10
      RATE_LIMIT_WRITE_PER_MINUTE: 30
      RATE_LIMIT_READ_PER_MINUTE: 1000
      CACHE_TTL_LIKE_COUNTS_SECS: 300
      CACHE_TTL_CONTENT_VALIDATION_SECS: 3600
      CACHE_TTL_USER_STATUS_SECS: 60
      SHUTDOWN_TIMEOUT_SECS: 30
      SSE_HEARTBEAT_INTERVAL_SECS: 15
      LEADERBOARD_REFRESH_INTERVAL_SECS: 60
      PROFILE_API_URL: http://mock-profile-api:8084
      CONTENT_API_POST_URL: http://mock-post-api:8081
      CONTENT_API_BONUS_HUNTER_URL: http://mock-bonus-hunter-api:8082
      CONTENT_API_TOP_PICKS_URL: http://mock-top-picks-api:8083
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health/live || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  mock-profile-api:
    build:
      context: .
      network: host
    environment:
      APP_MODE: mock-profile-api
      SERVICE_HOST: 0.0.0.0
      HTTP_PORT: 8084
    ports:
      - "8084:8084"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8084/health/live || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  mock-post-api:
    build:
      context: .
      network: host
    environment:
      APP_MODE: mock-content-api
      SERVICE_HOST: 0.0.0.0
      HTTP_PORT: 8081
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/health/live || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  mock-bonus-hunter-api:
    build:
      context: .
      network: host
    environment:
      APP_MODE: mock-content-api
      SERVICE_HOST: 0.0.0.0
      HTTP_PORT: 8082
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8082/health/live || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  mock-top-picks-api:
    build:
      context: .
      network: host
    environment:
      APP_MODE: mock-content-api
      SERVICE_HOST: 0.0.0.0
      HTTP_PORT: 8083
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8083/health/live || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
