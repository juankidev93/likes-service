services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: likes_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/20260315120000_init_likes.sql:/docker-entrypoint-initdb.d/001_init_likes.sql:ro
      - ./migrations/20260317133000_add_like_hourly_counts.sql:/docker-entrypoint-initdb.d/002_add_like_hourly_counts.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d likes_service"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      network: host
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVICE_HOST: 0.0.0.0
      HTTP_PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/likes_service
      READ_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/likes_service
      REDIS_URL: redis://redis:6379/
      LOG_LEVEL: info
      DB_MAX_CONNECTIONS: 20
      DB_MIN_CONNECTIONS: 5
      DB_ACQUIRE_TIMEOUT_SECS: 5
      RATE_LIMIT_WRITE_PER_MINUTE: 30
      RATE_LIMIT_READ_PER_MINUTE: 1000
      CACHE_TTL_LIKE_COUNTS_SECS: 300
      CACHE_TTL_CONTENT_VALIDATION_SECS: 3600
      SSE_HEARTBEAT_INTERVAL_SECS: 15
      PROFILE_API_URL: http://app:3000
      CONTENT_API_POST_URL: http://app:3000
      CONTENT_API_BONUS_HUNTER_URL: http://app:3000
      CONTENT_API_TOP_PICKS_URL: http://app:3000
    ports:
      - "3000:3000"

volumes:
  postgres_data:
